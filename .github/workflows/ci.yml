name: Kaveri Coding CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check VS Code extension syntax
        run: |
          node --check apps/vscode-extension/extension.js
          node --check apps/vscode-extension/server-extension.js
          node --check apps/vscode-extension/supabase.js
          node --check apps/vscode-extension/assignments-api.js

      - name: Install dashboard dependencies
        working-directory: apps/dashboard
        run: npm install

      - name: Build dashboard
        working-directory: apps/dashboard
        run: npm run build
